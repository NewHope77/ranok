<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#5EC8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ранок">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ранкова Експедиція</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=swap">
<style>
  :root{
    --jungle:#1F8A5B; --leaf:#7BD389; --sun:#FFC93C; --pink:#E8457A;
    --sky:#5EC8F2; --sand:#FFF4D6; --plum:#3A2350; --white:#FFFFFF;
    --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
    /* one task row gets what is left after header, footer and trail joins */
    --row: calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 210px) / 5);
    --pic: clamp(38px, calc(var(--row) - 26px), 84px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; overflow:hidden; overscroll-behavior:none}
  body{
    margin:0; color:var(--plum); font-family:var(--display); font-weight:800;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
    background:
      radial-gradient(110px 50px at 18% 5%, #fff 60%, transparent 61%),
      radial-gradient(130px 55px at 82% 3%, #ffffffcc 60%, transparent 61%),
      linear-gradient(var(--sky) 0 13%, var(--leaf) 13% 17%, var(--sand) 17%);
  }
  .app{
    height:100dvh; max-width:560px; margin:0 auto;
    padding-inline:16px;
    padding-block:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-bottom) + 10px);
    display:flex; flex-direction:column; gap:10px;
  }

  /* top bar: monkey · backpack · treasure */
  .top{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; flex:none}
  .round{all:unset; cursor:pointer; width:64px; height:64px; border-radius:50%; display:grid; place-items:center;
    background:var(--white); border:4px solid var(--plum); box-shadow:0 4px 0 var(--plum); font-size:40px; line-height:1}
  .round:active{transform:translateY(3px); box-shadow:0 1px 0 var(--plum)}
  .round:focus-visible{outline:3px solid var(--pink); outline-offset:3px}
  .monkey span{display:block; animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
  .pack{background:var(--pink); border:4px solid var(--plum); border-radius:22px; box-shadow:0 4px 0 var(--plum); padding:6px 8px;
    display:grid; grid-template-columns:repeat(5,1fr); gap:2px; min-width:0}
  .pack span{font-size:clamp(20px,6vw,28px); line-height:1.3; text-align:center; opacity:.3; filter:grayscale(1); transition:opacity .4s, filter .4s}
  .pack span.got{opacity:1; filter:none; animation:pop .5s}
  .chest{background:var(--sun)}
  .chest span{filter:grayscale(.9); opacity:.55; transition:all .5s}
  .chest.open span{filter:none; opacity:1; animation:pop .7s, bob 2s .7s ease-in-out infinite}

  /* map fills the rest */
  .map{flex:1; min-height:0; background:var(--sand); border:4px solid var(--plum); border-radius:28px; box-shadow:0 6px 0 var(--plum);
    background-image:radial-gradient(#e9d49c 1.5px, transparent 1.6px); background-size:18px 18px;
    padding:10px 12px; display:flex}
  .trail{list-style:none; margin:0; padding:0; flex:1; min-height:0; display:flex; flex-direction:column}
  .join{flex:1 1 0; min-height:4px; max-height:26px}
  .join svg{display:block; width:100%; height:100%}
  .join path{fill:none; stroke:var(--pink); stroke-width:5; stroke-dasharray:2 11; stroke-linecap:round}
  .join.walked path{stroke:var(--jungle)}
  .stop{flex:0 0 auto; display:flex; width:86%}
  .stop:nth-child(4n+3){margin-left:auto}
  .stop button{all:unset; box-sizing:border-box; cursor:pointer; width:100%; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    background:var(--white); border:4px solid var(--plum); border-radius:22px; padding:7px 12px 7px 8px; box-shadow:0 5px 0 var(--plum);
    transition:transform .15s, box-shadow .15s, background .3s}
  .stop button:active{transform:translateY(4px); box-shadow:0 1px 0 var(--plum)}
  .stop button:focus-visible{outline:4px solid var(--sky); outline-offset:3px}
  .pics{display:flex; gap:8px}
  .pic{width:var(--pic); height:var(--pic); border-radius:50%; background:var(--sky); border:3px solid var(--plum);
    display:grid; place-items:center; font-size:calc(var(--pic) * .58); line-height:1}
  .pic + .pic{background:#FFE08A}
  .check{width:calc(var(--pic) * .6); height:calc(var(--pic) * .6); min-width:32px; min-height:32px; border-radius:50%;
    border:4px dashed var(--plum); opacity:.45; display:grid; place-items:center; font-size:calc(var(--pic) * .36); color:var(--white)}
  .stop.next button{animation:nudge 1.6s ease-in-out infinite; background:#FFF9E6}
  @keyframes nudge{50%{transform:scale(1.03)}}
  .stop.done button{background:var(--leaf)}
  .stop.done .pic{background:var(--sun)}
  .stop.done .check{border-style:solid; background:var(--jungle); opacity:1; animation:pop .45s}
  @keyframes pop{0%{transform:scale(.3)} 60%{transform:scale(1.25)} 100%{transform:scale(1)}}

  /* bottom bar */
  .bottom{flex:none; display:flex; justify-content:space-between; align-items:center; gap:10px}
  .streak{font-size:20px; background:var(--white); border:3px solid var(--plum); border-radius:999px; padding:2px 14px; font-variant-numeric:tabular-nums}
  .tools{display:flex; gap:8px}
  .small{all:unset; cursor:pointer; width:44px; height:44px; border-radius:50%; background:var(--white); border:3px solid var(--plum);
    display:grid; place-items:center; font-size:22px; box-shadow:0 3px 0 var(--plum)}
  .small:active{transform:translateY(2px); box-shadow:0 1px 0 var(--plum)}
  .small:focus-visible{outline:3px solid var(--pink); outline-offset:2px}

  /* treasure celebration */
  .win{position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:24px; background:#3A2350aa}
  .win[hidden]{display:none}
  .win .card{all:unset; cursor:pointer; box-sizing:border-box; width:min(100%, 380px); background:var(--pink); border:5px solid var(--plum); border-radius:32px;
    box-shadow:0 10px 0 var(--plum); padding:22px 18px; text-align:center; color:var(--white); animation:pop .6s}
  .win .big{font-size:110px; line-height:1.1; animation:bob 2s ease-in-out infinite}
  .win h2{margin:0; font-size:44px; line-height:1; color:var(--sun); -webkit-text-stroke:2px var(--plum); paint-order:stroke fill}
  .win .row{font-size:38px; margin-top:10px; letter-spacing:4px}

  canvas#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:10}

  @media (max-height:640px){
    :root{--row: calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 180px) / 5)}
    .round{width:54px; height:54px; font-size:32px}
    .small{width:38px; height:38px; font-size:18px}
    .streak{font-size:17px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">
  <header class="top">
    <button class="round monkey" id="monkey" type="button" aria-label="Мавпочка"><span>🐒</span></button>
    <div class="pack" id="pack" aria-label="Рюкзачок з наліпками"></div>
    <div class="round chest" id="chest" aria-label="Скарб"><span>🎁</span></div>
  </header>

  <main class="map">
    <ol class="trail" id="trail"></ol>
  </main>

  <footer class="bottom">
    <div class="streak" id="streak" aria-label="Днів поспіль">🔥 0</div>
    <div class="tools">
      <button class="small" id="soundBtn" type="button" aria-label="Звук">🔊</button>
      <button class="small" id="resetBtn" type="button" aria-label="Почати заново">↺</button>
    </div>
  </footer>
</div>

<div class="win" id="win" hidden>
  <button class="card" id="winCard" type="button" aria-label="Закрити">
    <div class="big">💎</div>
    <h2>Ми це зробили!</h2>
    <div class="row" id="winRow"></div>
  </button>
</div>

<script>
const TASKS = [
  {id:"bed",   pics:["🛏️","🧸"], title:"Застелити ліжечко",         sticker:"🦋"},
  {id:"wc",    pics:["🚽","🧼"], title:"Сходити в туалет",          sticker:"🌸"},
  {id:"wash",  pics:["💦","🪥"], title:"Вмитися і почистити зубки", sticker:"🐬"},
  {id:"dress", pics:["👗","👟"], title:"Вдягнутися",                sticker:"🌈"},
  {id:"hair",  pics:["💇‍♀️","🎀"], title:"Причесатися",               sticker:"👑"}
];
const KEY = "morning-expedition-v1";
const today = () => new Date().toLocaleDateString("sv");
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toLocaleDateString("sv"); };

function load(){
  let s; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  s = Object.assign({date:today(), done:[], streak:0, lastFull:"", sound:true}, s || {});
  if (s.date !== today()){ s.date = today(); s.done = []; }
  if (s.lastFull && s.lastFull !== today() && s.lastFull !== yesterday()) s.streak = 0;
  return s;
}
let S = load();
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
const $ = id => document.getElementById(id);

/* sounds: synthesized with Web Audio, no files, work offline */
let ac = null;
function ctx(){
  if (!ac){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
  if (ac.state === "suspended") ac.resume();
  return ac;
}
const hz = semi => 440 * Math.pow(2, semi / 12);
function tone(semi, at, dur, {type = "triangle", vol = .22, slideTo = null} = {}){
  const a = ctx(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(hz(semi), t);
  if (slideTo !== null) o.frequency.exponentialRampToValueAtTime(hz(slideTo), t + dur * .8);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function bell(semi, at, dur = .5, vol = .2){ tone(semi, at, dur, {vol}); tone(semi + 12, at, dur * .6, {type:"sine", vol: vol * .35}); }
const SOUNDS = {
  done(step = 0){ const b = 15 + step * 2; [0, 4, 7, 12].forEach((s, i) => bell(b + s, i * .07, .45)); tone(b + 24, .3, .35, {type:"sine", vol:.08}); },
  undo(){ tone(10, 0, .18, {type:"sine", vol:.18, slideTo:3}); tone(5, .14, .22, {type:"sine", vol:.14, slideTo:-2}); },
  boing(){ tone(-5, 0, .32, {type:"sine", vol:.25, slideTo:14}); tone(14, .22, .25, {type:"sine", vol:.15, slideTo:7}); },
  win(){
    [[3,0],[8,.14],[12,.28],[15,.42]].forEach(([s,t]) => bell(s, t, .3, .2));
    [15, 19, 22, 27].forEach(s => bell(s, .62, 1.3, .12));
    [27, 31, 34, 39, 43].forEach((s, i) => tone(s, 1.05 + i * .06, .3, {type:"sine", vol:.06}));
  },
  again(){ tone(0, 0, .45, {type:"sine", vol:.16, slideTo:24}); bell(27, .38, .5, .12); }
};
function play(name, arg){ if (S.sound && SOUNDS[name]) try{ SOUNDS[name](arg); }catch(e){} }

function joinSVG(i, walked){
  const d = i % 2 === 0 ? "M 22 0 C 22 60, 78 40, 78 100" : "M 78 0 C 78 60, 22 40, 22 100";
  return `<li class="join ${walked ? "walked" : ""}" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${d}" vector-effect="non-scaling-stroke"/></svg></li>`;
}

function render(){
  const nextIdx = TASKS.findIndex(t => !S.done.includes(t.id));
  $("trail").innerHTML = TASKS.map((t, i) => {
    const done = S.done.includes(t.id);
    const cls = done ? "done" : (i === nextIdx ? "next" : "");
    return `<li class="stop ${cls}">
      <button type="button" id="task-${t.id}" data-id="${t.id}" aria-pressed="${done}" aria-label="${t.title}">
        <span class="pics" aria-hidden="true">${t.pics.map(p => `<span class="pic">${p}</span>`).join("")}</span>
        <span class="check" aria-hidden="true">${done ? "✓" : ""}</span>
      </button></li>` + (i < TASKS.length - 1 ? joinSVG(i, done) : "");
  }).join("");
  $("pack").innerHTML = TASKS.map(t => `<span class="${S.done.includes(t.id) ? "got" : ""}">${t.sticker}</span>`).join("");
  $("chest").classList.toggle("open", S.done.length === TASKS.length);
  $("streak").textContent = `🔥 ${S.streak}`;
  $("soundBtn").textContent = S.sound ? "🔊" : "🔇";
}

$("trail").addEventListener("click", e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const id = b.dataset.id;
  if (S.done.includes(id)){
    S.done = S.done.filter(x => x !== id);
    play("undo");
  } else {
    S.done.push(id);
    const r = b.getBoundingClientRect();
    burst(r.right - 30, r.top + r.height / 2, 26);
    if (S.done.length === TASKS.length){
      if (S.lastFull !== today()){ S.streak = (S.lastFull === yesterday() ? S.streak : 0) + 1; S.lastFull = today(); }
      play("win");
      $("winRow").textContent = TASKS.map(t => t.sticker).join("");
      setTimeout(() => { $("win").hidden = false; bigParty(); }, 350);
    } else {
      play("done", S.done.length - 1);
    }
  }
  save(); render();
});

$("winCard").addEventListener("click", () => { $("win").hidden = true; });
$("monkey").addEventListener("click", () => {
  play("boing");
  const next = document.querySelector(".stop.next button");
  if (next){ next.style.animation = "none"; next.offsetWidth; next.style.animation = "pop .6s"; setTimeout(() => next.style.animation = "", 650); }
  else { $("win").hidden = false; bigParty(); play("win"); }
});
$("soundBtn").addEventListener("click", () => { S.sound = !S.sound; save(); render(); play("boing"); });
$("resetBtn").addEventListener("click", () => { S.done = []; save(); render(); play("again"); });

/* confetti */
const cv = $("fx"), cx = cv.getContext("2d");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts = [], raf = 0;
function size(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
size(); addEventListener("resize", size);
const COLORS = ["#FFC93C","#E8457A","#5EC8F2","#1F8A5B","#7BD389","#FFFFFF"];
function burst(x, y, n){
  if (reduce) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 6;
    parts.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 4, r:4 + Math.random() * 5, c:COLORS[i % COLORS.length], life:70 + Math.random() * 40, rot:Math.random() * 6, star:Math.random() < .35});
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function bigParty(){ for (let k = 0; k < 6; k++) setTimeout(() => burst(Math.random() * innerWidth, innerHeight * (.2 + Math.random() * .4), 45), k * 220); }
function starPath(r){ cx.beginPath(); for (let i = 0; i < 10; i++){ const rr = i % 2 ? r * .45 : r, a = i * Math.PI / 5 - Math.PI / 2; cx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); }
function tick(){
  const d = devicePixelRatio;
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += .15; p.life--;
    cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life / 30);
    cx.fillStyle = p.c;
    if (p.star){ starPath(p.r * 1.6 * d); cx.fill(); } else cx.fillRect(-p.r * d, -p.r * .5 * d, p.r * 2 * d, p.r * d);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), 0);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.date !== today()){ S = load(); save(); render(); }
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
